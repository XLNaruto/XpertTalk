<!doctype html>
<html lang="en" class="dark" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
  <link rel="shortcut icon" href="media/logos/xperttalk-favilogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
    <title>XpertTalk</title>
    <script>
      // Prevent flash of wrong theme (syncs with next-themes storageKey="theme")
      (function() {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
        // Apply saved accent color
        try {
          var a = localStorage.getItem('xt-accent-color');
          if (a && a !== 'default') {
            document.documentElement.classList.add('accent-' + a);
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
